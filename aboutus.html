<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:url(Untitled\ design\ \(7\).png)
}


.founder-section{
  padding:80px 10%;
  background:transparent;
}

.founder-title{
  text-align:center;
  font-family: 'porkys';
  font-size:100px;
  font-weight:600;
  margin-bottom:70px;
  color:#266fb4;
  -webkit-text-stroke: white 5px;
}
.founder-title:hover{
  text-align:center;
  font-family: 'porkys';
  font-size:100px;
  font-weight:600;
  margin-bottom:70px;
  color:#266fb4;
  -webkit-text-stroke: rgb(52, 201, 255) 5px;
  transition: ease-in-out 0.5s;
}


.list{
  max-width:900px;
  margin-top: -50px;
  display:flex;
  margin-left: -50px;
  margin-left: 200px;
  flex-direction:column;
  gap:30px;
}

.item{
  display:flex;
  align-items:center;
  gap:30px;
  cursor:pointer;
  transition:.3s ease;
}

.photo{
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  background:#ccc;
  border:4px solid rgba(0,0,0,.1);
  transition:.3s ease;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.box{
  width:460px;
  padding:22px 26px;
  background:#fff;
  border-radius:18px;
  border:2px solid #281a73;
  transition:.3s ease;
}

.box h2{
  margin:0;
  font-size:22px;
  color:#29c1f9;
}

.box h4{
  margin:6px 0 10px;
  font-weight:500;
  color:#2b2ede;
}

.box p{
  margin:0;
  font-size:14.5px;
  line-height:1.6;
  color:#888;
}

.foundtitle{
  margin-top: -60px;
}
.item:hover{
  transform:translateX(6px);
}

.item:hover .photo{
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

/* CLICK EFFECT */
.item.dim{
  opacity:.25;
}
.item.active{
  opacity:1;
}

/* MOBILE */
@media(max-width:768px){
  .item{
    flex-direction:column;
    align-items:flex-start;
  }
  .box{
    width:100%;
  }
}
</style>

      </div>
    </div>

    <div class="item active">

        <img src="about3.jpeg" alt="Founder 3">
      </div>

        <h2>Gabrielle Cheryl Ho</h2>
        <h4>Founder</h4>
      </div>
    </div>

  </div>
</section>


<!-- ===== SCRIPT CLICK EFFECT ===== -->
<script>
const items = document.querySelectorAll('.item');

items.forEach(item=>{
  item.addEventListener('click',()=>{
    items.forEach(i=>{
      i.classList.toggle('active', i === item);
      i.classList.toggle('dim', i !== item);
    });
  });
});
</script>

</body>
