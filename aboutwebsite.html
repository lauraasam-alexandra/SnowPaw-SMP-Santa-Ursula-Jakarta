<style>

  html, body{
  height:100%;
  overflow:hidden;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  overflow-x:hidden;
    overflow: hidden;
}

#about-slider{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top: -80px;
  padding:80px;
  color:#fff;
  background-size:cover;
  background-position:center;
  transition:background-image 1s ease;
}
#about-slider::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,rgba(0,0,0,.7),rgba(0,0,0,.4));
  z-index:0;
}
#about-slider *{position:relative;z-index:1}
.cards{
  display:flex;
  gap:26px;
}
.card{
  width:160px;
  height:220px;
  border-radius:24px;
  background-size:cover;
  margin-top: 200px;
  background-position:center;
  border:2px solid rgb(35,215,255);
  cursor:pointer;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
  transition:.45s cubic-bezier(.25,.8,.25,1);
  opacity:0.3;
}
.card.active{
  transform:translateY(-6px) scale(1.1);
  opacity:1;
  border-color:#fff;
}
.nav{
  margin-top:25px;
  display:flex;
  gap:14px;
}
.btn{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:pointer;
  transition:.25s;
}
.btn:hover{transform:scale(1.15)}
.text-box{
  max-width:580px;
  max-height: 400px;
  border-radius:30px;
  background:rgba(79, 223, 255, 0.55);
  margin-top: 220px;
  backdrop-filter:blur(14px);
  box-shadow:0 25px 60px rgba(232, 242, 255, 0.6);
  animation:pop .6s ease;
}
@keyframes pop{
  from{opacity:0;transform:scale(.9) translateY(20px)}
  to{opacity:1;transform:none}
}
.text-box h1{
  font-size:42px;
  margin-bottom:14px;
}
.text-box p{
  line-height:1.7;
  opacity:.95;
}
@media(max-width:900px){
  #about-slider{
    flex-direction:column;
    gap:40px;
    padding:50px 25px;
  }
  .cards{justify-content:center}
  .text-box{text-align:center}
}
</style>

<body>

<section id="about-slider">
  <div>
    <div class="cards">
      <div class="card" data-i="0"></div>
      <div class="card" data-i="1"></div>
      <div class="card" data-i="2"></div>
    </div>

    <div class="nav">
      <div class="btn" data-dir="-1">&#10094;</div>
      <div class="btn" data-dir="1">&#10095;</div>
    </div>
  </div>

  <div class="text-box">
    <h1 id="title"></h1>
    <p id="desc"></p>
  </div>
</section>

<script>
const slider = document.getElementById("about-slider");
const title = document.getElementById("title");
const desc = document.getElementById("desc");
const cards = document.querySelectorAll(".card");
const cardImages = [
  "about3.jpeg",
  "sam.jpeg",
  "angel.jpeg"
];
const slides = [
  {
    bg:"about2 (1).jpeg",
    title:"Who Are We?",
    desc:"Hi everyone! We are Angeline, Samantha, and Cheryl a group of young creators passionate about climate issues, creativity, and making meaningful change through digital platforms."
  },
  {
    bg:"about2 (2).jpeg",
    title:"Why Climate Change Matters",
    desc:"Climate change is an urgent global issue. Rising temperatures, extreme weather, floods, droughts, forest fires, and melting polar ice show that Earth is under serious environmental pressure."
  },
  {
    bg:"about2 (3).jpeg",
    title:"Our Purpose",
    desc:"Inspired by the PesonaEdu Young Creators Competition 2025, this website was created to educate, raise awareness, and empower people to take real climate action as Eco Heroes."
  }
];

let index = 0;

function render(){
  slider.style.backgroundImage = `url('${slides[index].bg}')`;
  title.textContent = slides[index].title;
  desc.textContent = slides[index].desc;

  cards.forEach((card,i)=>{
    card.style.backgroundImage = `url('${cardImages[i]}')`;
    card.classList.remove("active");
    if(i === index) card.classList.add("active");
  });
}
document.querySelectorAll(".btn").forEach(btn=>{
  btn.onclick = ()=>{
    index = (index + Number(btn.dataset.dir) + slides.length) % slides.length;
    render();
  };
});
cards.forEach(card=>{
  card.onclick = ()=>{
    index = Number(card.dataset.i);
    render();
  };
});
render();
</script>
